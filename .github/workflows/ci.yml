name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      # v10.3.3: pin the verified release commit because the v10 alias does not resolve.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python scripts/gates/common.py --ci

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  dependency-audit:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.12"
      - name: Export locked dependencies
        env:
          REQUIREMENTS_FILE: ${{ runner.temp }}/labquorum-requirements.txt
        shell: pwsh
        run: uv export --locked --all-groups --no-emit-project --format requirements.txt --output-file "$env:REQUIREMENTS_FILE"
      - name: Audit dependencies
        env:
          REQUIREMENTS_FILE: ${{ runner.temp }}/labquorum-requirements.txt
        shell: pwsh
        run: uvx --python 3.12 --from pip-audit pip-audit -r "$env:REQUIREMENTS_FILE"

  install-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.12"
      - name: Install the checked-out package as a tool
        run: uv tool install --python 3.12 .
      - name: Exercise the installed CLI with a temporary ledger
        shell: pwsh
        run: |
          $toolBin = (uv tool dir --bin).Trim()
          $separator = [IO.Path]::PathSeparator
          $env:PATH = "$toolBin$separator$env:PATH"
          Add-Content -Path $env:GITHUB_PATH -Value $toolBin -Encoding utf8

          & lq --help
          if ($LASTEXITCODE -ne 0) { throw "lq --help failed with exit code $LASTEXITCODE" }

          $ledgerDirectory = Join-Path $env:RUNNER_TEMP "labquorum-ci"
          New-Item -ItemType Directory -Path $ledgerDirectory -Force | Out-Null
          $databasePath = Join-Path $ledgerDirectory "ledger.sqlite"

          & lq init --db $databasePath
          if ($LASTEXITCODE -ne 0) { throw "lq init failed with exit code $LASTEXITCODE" }

          $anchorDate = [DateTime]::UtcNow.ToString("yyyy-MM-dd")
          & lq seed --demo --db $databasePath --anchor-date $anchorDate
          if ($LASTEXITCODE -ne 0) { throw "lq seed failed with exit code $LASTEXITCODE" }

          & lq audit verify --db $databasePath
          if ($LASTEXITCODE -ne 0) { throw "lq audit verify failed with exit code $LASTEXITCODE" }
