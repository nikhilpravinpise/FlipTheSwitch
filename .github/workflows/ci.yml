name: CI

on:
  push:
  pull_request:

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # GitHub releases list v10 as the current major: https://github.com/astral-sh/setup-uv/releases
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python scripts/gates/common.py --ci
