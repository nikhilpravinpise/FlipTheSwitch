# Roadmap template: requires separately implemented specialist tools and certification.
# LabQuorum project room template: run once per research project.
#
# Reuses the agents that labquorum-lab.template.yaml created (agent-typed
# params, as in examples/room-templates/red-blue-workroom.template.yaml), so
# it never creates agents and can be run again for every new project, every
# demo take ("egcg-take3") and every E2E run ("e2e-<timestamp>") without a
# name_taken refusal. It defines no roles: an agent holds one role lease
# globally, and the agents already hold their roles in the HQ room.
#
# DRAFT. Verify on Day 1 (spike S4): user-typed params with required: false,
# aliases keyed by param values, kickoff addressing aliases.
version: 1

params:
  lab:
    type: string
    description: Same prefix used when creating the lab agents
    default: rao
    pattern: "[a-z][a-z0-9-]*"
  project:
    type: string
    description: Unique project or take slug
    pattern: "[a-z][a-z0-9-]*"
  question:
    type: string
    multiline: true
    description: The research question, hypotheses and success criteria (becomes the Project charter)
  scout:
    type: agent
    description: The lab's literature agent (for example rao-scout)
  labops:
    type: agent
    description: The lab's operations agent (for example rao-labops)
  analyst:
    type: agent
    description: The lab's analysis agent (for example rao-analyst)
  scribe:
    type: agent
    description: The lab's writing agent (for example rao-scribe)
  pi_desk:
    type: agent
    description: The PI's gate agent (for example rao-pi-desk)
  member_1:
    type: user
    description: A lab member to invite (for example the student on this project)
    required: false
  member_2:
    type: user
    description: Another internal lab member
    required: false
  bridge:
    type: bridge
    description: Messaging app for the room. The server's default app is chosen.
    default: [$first]

room:
  name: "{lab}-proj-{project}"
  description: "Research project {project}, from question to paper."
  bridge: "{bridge}"
  channel_type: channel_private
  agents: ["{scout}", "{labops}", "{analyst}", "{scribe}", "{pi_desk}"]
  users: ["{$creator}", "{member_1}", "{member_2}"]
  aliases:
    "{scout}": scout
    "{labops}": labops
    "{analyst}": analyst
    "{scribe}": scribe
    "{pi_desk}": pi-desk
  instructions: |
    Project {project}. Use only synthetic or public nonsensitive data.
    Internal members only; external review requires a separate sanitized room.
    Citation identity and retraction checks do not establish claim support.
    Mention first. Each binding request requires its own PI decision.
  docs:
    - name: Project charter
      description: Question, hypotheses, success criteria
      instructions: Use this to judge relevance of papers and to plan analyses.
      content: |
        {question}

kickoff: |
  @scout @labops @analyst @scribe @pi-desk hello, this is project {project}. Each of you, in one line: what you will do here
