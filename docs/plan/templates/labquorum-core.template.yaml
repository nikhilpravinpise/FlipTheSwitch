# Draft Switch template; certify the installed runtime before use.
version: 1
params:
  lab:
    type: string
    description: Prefix for every agent and room name (for example "rao")
    pattern: '[a-z][a-z0-9-]*'
  workspace:
    type: directory
    description: Absolute path of your LabQuorum clone (agents run in its agents/
      folders)
  provider:
    type: provider
    description: Coding agent for every LabQuorum agent. Gated agents need Claude
      Code.
    default:
    - claude
    input: advanced
  location:
    type: location
    description: The machine the agents run on.
    default: local
    input: advanced
  bridge:
    type: bridge
    description: Messaging app for both rooms. The server's default app is chosen.
    default:
    - $first
agents:
- name: '{lab}-scout'
  description: Literature capability unavailable in the booking-only baseline.
  addressing: anyone
  provider: '{provider}'
  location: '{location}'
  directory: '{workspace}/agents/scout'
  auto_mode: false
  auto_approve: false
  instructions: "Literature search and data analysis are unavailable in the booking-only baseline; say they are unavailable and do not attempt these tools."
- name: '{lab}-labops'
  description: Booking proposals. Never commits.
  addressing: anyone
  provider: '{provider}'
  location: '{location}'
  directory: '{workspace}/agents/labops'
  auto_mode: false
  auto_approve: false
  instructions: "Handle booking proposals only. Check availability and training; propose a same-duration alternative on conflict, call propose_booking and hand its request ID to pi-desk. Do not call deferred inventory, protocol, bench or literature tools. Never claim a booking is committed without ledger evidence."
- name: '{lab}-analyst'
  description: Analysis capability unavailable in the booking-only baseline.
  addressing: anyone
  provider: '{provider}'
  location: '{location}'
  directory: '{workspace}/agents/analyst'
  auto_mode: false
  auto_approve: false
  instructions: "Literature search and data analysis are unavailable in the booking-only baseline; say they are unavailable and do not attempt these tools."
- name: '{lab}-pi-desk'
  description: The PI's gate. Validates proposals and executes commits only after
    the PI approves in Switch.
  addressing: owner-agents
  provider: claude
  can_manage_agents: false
  location: '{location}'
  directory: '{workspace}/agents/pi-desk'
  auto_mode: false
  auto_approve: false
  instructions: "Handle booking requests only. Use get_request and policy_check, then the certified commit_booking gate with the exact structured decision. Never simulate approval. If certification fails, leave requests unapproved and do not commit. Do not call deferred tools."
room:
  name: '{lab}-lab-hq'
  description: 'Synthetic booking-only demo.'
  bridge: '{bridge}'
  channel_type: channel_private
  agents:
  - '{lab}-labops'
  - '{lab}-pi-desk'
  - '{lab}-scout'
  - '{lab}-analyst'
  users:
  - '{$creator}'
  aliases:
    '{lab}-labops': labops
    '{lab}-pi-desk': pi-desk
    '{lab}-scout': scout
    '{lab}-analyst': analyst
  roles:
  - name: librarian
    exclusive: true
    instructions: State that literature is unavailable in the booking-only baseline.
  - name: bench-manager
    exclusive: true
    instructions: Coordinate booking proposals only.
  - name: approver
    exclusive: true
    instructions: Present decisions to the PI and execute what the PI approves.
  instructions: 'This is the {lab} lab operations room.

    Ask @labops to propose bookings.

    @pi-desk calls the booking commit only after certification and review.

    Only the configured PI may authorize those requests.

    Use one thread per request, with the mention first and text after it.

    The ledger is authoritative; ask @labops for a current readable status.

    Each binding request requires its own PI decision. Use Allow once. LabQuorum does
    not offer batch approval. Session-wide provider permission never authorizes another
    lab request.

    '
  docs:
  - name: Lab handbook
    description: How this lab works with its agents
    instructions: Read on joining. Follow the mention, thread and approval etiquette.
    content: 'Mention first and put text after the mention.

      Each binding request requires its own PI decision. Use Allow once. LabQuorum
      does not offer batch approval. Session-wide provider permission never authorizes
      another lab request.

      Verify the displayed person, resource, absolute time, quantity and revision.

      To inspect current lab state, ask @labops to post its status in this thread.

      !list-documents lists agent context; ask its creator for readable content.

      Health: !agents-status. HQ role holders: !roles.

      '
  - name: Instrument rules
    description: Booking rules per instrument
    instructions: Apply these when proposing bookings; the ledger enforces them too.
    content: 'Plate reader (Tecan Spark, room 3.14): training required, max 4 h,

      15 min cleaning gap, bookable 14 days ahead.

      Biosafety cabinet A: training required, max 3 h, 30 min UV gap.

      '
kickoff: '@labops @pi-desk @scout @analyst hello. Please take your roles here: scout as librarian, labops as bench-manager, and pi-desk as approver. Labops and pi-desk handle booking proposals only; scout and analyst state that literature and analysis are unavailable.'
