[project]
name = "labquorum"
version = "0.1.0"
description = "Booking workflows for shared laboratory instruments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=1,<2",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
    "tzdata>=2026.6",
]

[project.scripts]
lq = "labquorum.cli.main:main"
lq-mcp = "labquorum.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labquorum"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL"]
# E501 is handled by the formatter; PLR2004 permits intentional test constants such as 50 races.
ignore = ["E501", "PLR2004"]

[tool.ruff.format]
line-ending = "lf"

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "basic"
strict = ["src"]
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--timeout=60", "-m", "not live"]
markers = [
    "slow: tests that take longer than the normal suite",
    "race: concurrency and race-condition tests",
    "live: tests that require live external services",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.3",
    "syrupy>=6.1.1",
]
