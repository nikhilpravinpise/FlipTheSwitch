[project]
name = "labquorum"
version = "1.0.1"
description = "Shared-instrument booking ledger and approval workflow for lab teams"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Nikhil Pravin Pise" },
    { name = "Darshan Ved" },
]
requires-python = ">=3.12,<3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "httpx>=0.28.1,<1.0.0",
    "matplotlib>=3.11.2",
    "mcp>=1,<2",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "structlog>=26.1.0",
    "tzdata>=2026.6",
]

[project.optional-dependencies]
demo = ["playwright>=1.50,<2"]

[project.urls]
Homepage = "https://github.com/nikhilpravinpise/FlipTheSwitch"
Repository = "https://github.com/nikhilpravinpise/FlipTheSwitch"
Issues = "https://github.com/nikhilpravinpise/FlipTheSwitch/issues"

[project.scripts]
lq = "labquorum.cli.main:main"
lq-mcp = "labquorum.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labquorum"]

[tool.hatch.build.targets.wheel.force-include]
"seed/demo.yaml" = "labquorum/store/demo.yaml"
"src/labquorum/store/schema.sql" = "labquorum/store/schema.sql"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL"]
# E501 is handled by the formatter; PLR2004 permits intentional test constants such as 50 races.
ignore = ["E501", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
# These gate functions mirror ordered acceptance checks and fail-closed probe stages.
"scripts/gates/common.py" = ["PLR0911", "PLR0912", "PLR0915"]
"scripts/gates/p2_stdio_probe.py" = ["PLR0911", "PLR0912", "PLR0915"]

[tool.ruff.format]
line-ending = "lf"
# Inputs are preserved as supplied under the repository's no-edit rule.
exclude = ["docs/inputs/**"]

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "basic"
strict = ["src"]
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--timeout=60", "--block-network", "--record-mode=none", "-m", "not live"]
markers = [
    "slow: tests that take longer than the normal suite",
    "race: concurrency and race-condition tests",
    "live: tests that require live external services",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-recording>=0.14.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "respx>=0.23.1",
    "ruff>=0.17.3",
    "syrupy>=6.1.1",
]
